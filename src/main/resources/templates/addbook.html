<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <title>Add book</title>
</head>

<body class="m-3">
    <h1>Add book</h1>
    <form action="#" th:action="@{/book/save}" th:object="${book}" method="post">
        <table>
            <tr>
                <th>ISBN:</th>
                <td><input type="text" class="form-control" th:field="*{isbn}" /></td>
            </tr>
            <tr>
                <th>Title:</th>
                <td><input type="text" class="form-control" th:field="*{title}" /></td>
            </tr>
            <tr>
                <th>Author:</th>
                <td><input type="text" class="form-control" th:field="*{author}" /></td>
            </tr>
            <tr>
                <th>Category:</th>
                <td><select id="categorylist" th:field="*{category}" class="form-select">
                        <option th:each="category: ${categories}" th:value="${category.id}" th:text="${category.name}">
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Year:</th>
                <td><input type="number" class="form-control" th:field="*{publicationYear}" /></td>
            </tr>
            <tr>
                <th>Price:</th>
                <td><input type="number" class="form-control" step="0.01" th:field="*{price}" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Save" class="btn btn-success" />
                    <a class="btn btn-danger" th:href="@{/book/list}">Cancel</a>
                </td>
            </tr>
        </table>

        <div th:if="${#fields.hasAnyErrors()}" class="error" style="color: red; margin-top: 10px;">
            Error submitting form. Check input.
        </div>
    </form>
</body>


</html>
