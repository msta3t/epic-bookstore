<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
    <title>Add book</title>
</head>

<body>
    <h1>Add book</h1>
    <form action="#" th:action="@{/save}" th:object="${book}" method="post">
        <table>
            <tr>
                <th>ISBN:</th>
                <td><input type="text" th:field="*{isbn}"/></td>
            </tr>
            <tr>
                <th>Title:</th>
                <td><input type="text" th:field="*{title}" /></td>
            </tr>
            <tr>
                <th>Author:</th>
                <td><input type="text" th:field="*{author}" /></td>
            </tr>
            <tr>
                <th>Year:</th>
                <td><input type="number" th:field="*{publicationYear}" /></td>
            </tr>
            <tr>
                <th>Price:</th>
                <td><input type="number" step="0.01" th:field="*{price}" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Save" /></td>
            </tr>
        </table>

        <div th:if="${#fields.hasAnyErrors()}" class="error" style="color: red; margin-top: 10px;">
            Error submitting form. Check input.
        </div>
    </form>
</body>


</html>
