<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
    <title>Categories</title>
</head>

<body>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Categories</h1>
        <a class="btn btn-info" th:href="@{/book/list}">Books</a>
    </div>
    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Category</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td><a class="btn btn-primary" th:href="@{/category/edit/{id}(id=${category.id})}">Edit</a></td>
            <td><a class="btn btn-danger" th:href="@{/category/delete/{id}(id=${category.id})}">Delete</a></td>
        </tr>
    </table>
    <div th:replace="~{addcategory::addCategoryComponent}"></div>
</body>

</html>
