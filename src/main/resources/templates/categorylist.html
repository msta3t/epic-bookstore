<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <title>Categories</title>
</head>

<body class="m-3">
    <div class="d-flex flex-row align-items-center mb-3 p-3">
        <a class="btn btn-outline-primary me-2" th:href="@{/book/list}">Books</a>
        <a class="btn btn-primary btn-lg me-2">Categories</a>
        <p class="ms-auto mb-0 align-self-center">
            <span class="fw-bold" sec:authentication="name"></span>
        </p>
        <form th:action="@{/logout}" method="post" class="ms-3">
            <button type="submit" class="btn btn-danger">Log out</button>
        </form>
    </div>

    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Category</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td><a class="btn btn-primary" th:href="@{/category/edit/{id}(id=${category.id})}">Edit</a></td>
            <div sec:authorize="hasAuthority('ADMIN')">
                <td><a class="btn btn-danger" th:href="@{/category/delete/{id}(id=${category.id})}">Delete</a></td>
            </div>
        </tr>
    </table>
    <div th:replace="~{addcategory::addCategoryComponent}"></div>
</body>

</html>
