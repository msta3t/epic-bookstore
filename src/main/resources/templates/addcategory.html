<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
    <title>Add category</title>
</head>

<body class="m-3">
    <div th:fragment="addCategoryComponent">
    <h2>Add category</h2>
    <form action="#" th:action="@{/category/save}" th:object="${category}" method="post">
        <table>
            <tr>
                <th>Name:</th>
                <td><input type="text" class="form-control" th:field="*{name}" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Save" class="btn btn-success"/></td>
            </tr>
        </table>

        <div th:if="${#fields.hasAnyErrors()}" class="error" style="color: red; margin-top: 10px;">
            Error submitting form. Check input.
        </div>
    </form>
    </div>
</body>


</html>
